<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopy Online - Toko Customer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root { 
      --shopee-orange: #ee4d2d; 
      --yellow-basket: #ffc107; 
      --yellow-hover: #e0a800;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f5f5f5; color: #333; min-height: 100vh; }

    /* HEADER */
    header {
      background: var(--shopee-orange);
      color: white; 
      padding: 12px 20px;
      position: sticky; 
      top: 0; 
      z-index: 100;
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .brand { font-size: 20px; font-weight: bold; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .btn-admin { 
      background: rgba(255,255,255,0.2); 
      color: white; 
      border: 1px solid white; 
      padding: 6px 12px; 
      border-radius: 4px; 
      text-decoration: none; 
      font-size: 12px; 
      font-weight: bold; 
      transition: 0.2s;
    }
    .btn-admin:hover { background: white; color: var(--shopee-orange); }

    /* KATALOG PRODUK */
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    @media (min-width: 600px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }

    .product-card { 
      background: white; 
      border-radius: 8px; 
      overflow: hidden; 
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-3px); }
    .product-img-box { position: relative; width: 100%; height: 180px; background: #f8f8f8; }
    .product-img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 10px; }
    .product-title { font-size: 13px; font-weight: 600; height: 34px; overflow: hidden; margin-bottom: 8px; line-height: 1.3; }
    .product-price { color: var(--shopee-orange); font-weight: bold; font-size: 15px; margin-bottom: 10px; }
    
    .btn-buy { 
      background: var(--shopee-orange); 
      color: white; 
      border: none; 
      width: 100%; 
      padding: 8px; 
      border-radius: 4px; 
      font-weight: bold; 
      font-size: 12px; 
      cursor: pointer; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    
    .loading-text { grid-column: 1/-1; text-align: center; padding: 50px; color: #777; font-size: 14px; }
  </style>

  <!-- FIREBASE SDK (Cloud Database Google) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header>
    <a href="index.html" class="brand"><i class="fas fa-bag-shopping"></i> Sopy Online</a>
    <a href="admin.html" class="btn-admin"><i class="fas fa-user-shield"></i> Portal Admin</a>
  </header>

  <div class="container">
    <h3 style="margin-bottom:15px; color:var(--shopee-orange); font-size: 16px;">
      <i class="fas fa-store"></i> KATALOG PRODUK TOKO
    </h3>
    
    <div class="product-grid" id="productGrid">
      <div class="loading-text"><i class="fas fa-spinner fa-spin"></i> Memuat produk dari server...</div>
    </div>
  </div>

  <script>
    // Koneksi Cloud Database Firebase
    const firebaseConfig = {
      databaseURL: "https://sopy-online-demo-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getFallbackImage(text) {
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><rect width="100%" height="100%" fill="#ee4d2d"/><text x="50%" y="50%" fill="#ffffff" font-size="20" font-weight="bold" font-family="Arial" text-anchor="middle" dominant-baseline="middle">${encodeURIComponent(text)}</text></svg>`);
    }

    // LISTENER REALTIME: Ketika Admin Upload, Customer Langsung Terima Data Baru!
    db.ref('products').on('value', (snapshot) => {
      const grid = document.getElementById('productGrid');
      const data = snapshot.val();

      if (!data) {
        grid.innerHTML = `<div class="loading-text">Belum ada produk yang di-upload oleh Admin.</div>`;
        return;
      }

      let html = '';
      Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        const title = item.title || 'Produk';
        const price = Number(item.price) || 0;
        const image = item.image || getFallbackImage(title);

        html += `
          <div class="product-card">
            <div class="product-img-box">
              <img src="${image}" class="product-img" alt="${title}" onerror="this.src='${getFallbackImage('Gambar Error')}'">
            </div>
            <div class="product-info">
              <div class="product-title">${title}</div>
              <div class="product-price">Rp ${price.toLocaleString('id-ID')}</div>
              <button class="btn-buy" onclick="alert('Kamu memilih produk: ${title}')">
                <i class="fas fa-shopping-cart"></i> Beli Sekarang
              </button>
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
    });
  </script>
</body>
</html>
