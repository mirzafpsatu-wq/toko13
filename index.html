<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopy Online - Toko Customer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root { --shopee-orange: #ee4d2d; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f5f5f5; color: #333; min-height: 100vh; }

    header {
      background: var(--shopee-orange);
      color: white; padding: 12px 20px;
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .brand { font-size: 20px; font-weight: bold; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .btn-admin { 
      background: rgba(255,255,255,0.2); color: white; border: 1px solid white; 
      padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; 
    }
    .btn-admin:hover { background: white; color: var(--shopee-orange); }

    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    @media (min-width: 600px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }

    .product-card { 
      background: white; border-radius: 8px; overflow: hidden; 
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between;
    }
    .product-img-box { position: relative; width: 100%; height: 180px; background: #f8f8f8; }
    .product-img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 10px; }
    .product-title { font-size: 13px; font-weight: 600; height: 34px; overflow: hidden; margin-bottom: 8px; line-height: 1.3; }
    .product-price { color: var(--shopee-orange); font-weight: bold; font-size: 15px; margin-bottom: 10px; }
    
    .btn-buy { 
      background: var(--shopee-orange); color: white; border: none; width: 100%; 
      padding: 8px; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; 
    }
    
    .empty-text { grid-column: 1/-1; text-align: center; padding: 50px; color: #777; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand"><i class="fas fa-bag-shopping"></i> Sopy Online</a>
    <a href="admin.html" class="btn-admin"><i class="fas fa-user-shield"></i> Portal Admin</a>
  </header>

  <div class="container">
    <h3 style="margin-bottom:15px; color:var(--shopee-orange); font-size: 16px;">
      <i class="fas fa-store"></i> KATALOG PRODUK TOKO
    </h3>
    
    <div class="product-grid" id="productGrid">
      <div class="empty-text"><i class="fas fa-spinner fa-spin"></i> Memuat produk...</div>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://api.jsonbin.io/v3/b/65d12345dc74654018a12345"; // Jembatan database online

    async function loadProductsFromOnline() {
      const grid = document.getElementById('productGrid');
      try {
        const response = await fetch('https://api.npoint.io/46c0a00632cd22ba71cb');
        const data = await response.json();
        const products = data.products || [];

        if (products.length === 0) {
          grid.innerHTML = `<div class="empty-text"><i class="fas fa-box-open" style="font-size:30px; margin-bottom:10px; display:block;"></i>Belum ada produk dari Admin.</div>`;
          return;
        }

        let html = '';
        products.forEach((item) => {
          html += `
            <div class="product-card">
              <div class="product-img-box">
                <img src="${item.image}" class="product-img" alt="${item.title}">
              </div>
              <div class="product-info">
                <div class="product-title">${item.title}</div>
                <div class="product-price">Rp ${Number(item.price).toLocaleString('id-ID')}</div>
                <button class="btn-buy" onclick="alert('Kamu memilih: ${item.title}')">
                  <i class="fas fa-shopping-cart"></i> Beli Sekarang
                </button>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;
      } catch (err) {
        grid.innerHTML = `<div class="empty-text">Gagal mengambil data dari server.</div>`;
      }
    }

    loadProductsFromOnline();
  </script>
</body>
</html>
