<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopy Online - Toko Customer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root { --shopee-orange: #ee4d2d; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f5f5f5; color: #333; min-height: 100vh; padding-bottom: 30px; }

    /* HEADER & NAVBAR */
    header {
      background: var(--shopee-orange);
      color: white; padding: 12px 20px;
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .brand { font-size: 18px; font-weight: bold; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    
    /* BADGE KERANJANG */
    .cart-btn {
      position: relative; background: rgba(255,255,255,0.2); color: white;
      border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer;
      font-size: 14px; display: flex; align-items: center; gap: 6px;
    }
    .cart-badge {
      background: #ffc107; color: #333; font-weight: bold;
      border-radius: 50%; padding: 2px 7px; font-size: 11px;
    }
    
    .btn-admin { 
      background: white; color: var(--shopee-orange); border: none;
      padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; 
    }

    /* KATALOG */
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    @media (min-width: 600px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }

    .product-card { 
      background: white; border-radius: 8px; overflow: hidden; 
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-3px); }
    .product-img-box { position: relative; width: 100%; height: 170px; background: #f8f8f8; }
    .product-img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-size: 13px; font-weight: 600; height: 34px; overflow: hidden; margin-bottom: 8px; line-height: 1.3; }
    .product-price { color: var(--shopee-orange); font-weight: bold; font-size: 15px; margin-bottom: 10px; }
    
    .btn-buy { 
      background: var(--shopee-orange); color: white; border: none; width: 100%; 
      padding: 8px; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; 
    }

    /* MODAL POPUP */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 15px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white; border-radius: 12px; max-width: 450px; width: 100%;
      max-height: 90vh; overflow-y: auto; padding: 20px; position: relative;
      animation: modalFade 0.2s ease-out;
    }
    @keyframes modalFade { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .close-modal { position: absolute; top: 12px; right: 15px; font-size: 22px; cursor: pointer; color: #888; }
    
    .detail-img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
    .detail-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
    .detail-price { color: var(--shopee-orange); font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    .detail-desc { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 20px; background: #f9f9f9; padding: 10px; border-radius: 6px; }

    /* ITEM KERANJANG */
    .cart-item { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .cart-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    .cart-item-info { flex-grow: 1; }
    .cart-item-title { font-size: 13px; font-weight: bold; }
    .cart-item-price { color: var(--shopee-orange); font-size: 12px; font-weight: bold; }
    .cart-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-top: 15px; padding-top: 10px; border-top: 2px solid #ddd; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand"><i class="fas fa-bag-shopping"></i> Sopy Online</a>
    <div class="nav-actions">
      <button class="cart-btn" onclick="openCartModal()">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cartCount">0</span>
      </button>
      <a href="admin.html" class="btn-admin"><i class="fas fa-user-shield"></i> Admin</a>
    </div>
  </header>

  <div class="container">
    <h3 style="margin-bottom:15px; color:var(--shopee-orange); font-size: 16px;">
      <i class="fas fa-store"></i> KATALOG PRODUK TOKO
    </h3>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- MODAL DETAIL PRODUK -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('detailModal')">&times;</span>
      <img id="modalImg" src="" class="detail-img">
      <div id="modalTitle" class="detail-title"></div>
      <div id="modalPrice" class="detail-price"></div>
      <div id="modalDesc" class="detail-desc"></div>
      <button class="btn-buy" style="padding: 12px; font-size: 14px;" id="modalAddBtn">
        <i class="fas fa-cart-plus"></i> Tambah Ke Keranjang
      </button>
    </div>
  </div>

  <!-- MODAL KERANJANG BELANJA -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('cartModal')">&times;</span>
      <h3 style="margin-bottom:15px; color:var(--shopee-orange);"><i class="fas fa-shopping-cart"></i> Keranjang Saya</h3>
      <div id="cartList"></div>
      <div class="cart-total">
        <span>Total Bayar:</span>
        <span id="cartTotal" style="color:var(--shopee-orange);">Rp 0</span>
      </div>
      <button class="btn-buy" style="margin-top:15px; padding: 12px; background:#28a745;" onclick="checkout()">
        <i class="fas fa-check-circle"></i> Checkout Sekarang
      </button>
    </div>
  </div>

  <script>
    // FUNGSI CEK OTOMATIS SUPAYA KATALOG TIDAK KOSONG SAMA SEKALI
    const defaultProducts = [
      {
        id: 101,
        title: "Kemeja Casual Polos Premium",
        price: 85000,
        desc: "Bahan katun dingin nyaman dipakai seharian untuk kerja maupun santai.",
        image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400"
      },
      {
        id: 102,
        title: "Sepatu Sneaker Keren Pria/Wanita",
        price: 145000,
        desc: "Sepatu ringan empuk cocok untuk jalan-jalan dan olahraga santai.",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
      }
    ];

    let cart = JSON.parse(localStorage.getItem('sopy_cart') || '[]');

    function getProducts() {
      let data = localStorage.getItem('sopy_products');
      if (!data || JSON.parse(data).length === 0) {
        localStorage.setItem('sopy_products', JSON.stringify(defaultProducts));
        return defaultProducts;
      }
      return JSON.parse(data);
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const products = getProducts();
      let html = '';

      products.forEach((p) => {
        html += `
          <div class="product-card" onclick="openDetail(${p.id})">
            <div class="product-img-box">
              <img src="${p.image}" class="product-img" alt="${p.title}">
            </div>
            <div class="product-info">
              <div>
                <div class="product-title">${p.title}</div>
                <div class="product-price">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
              </div>
              <button class="btn-buy" onclick="event.stopPropagation(); addToCart(${p.id})">
                <i class="fas fa-cart-plus"></i> + Keranjang
              </button>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;
      updateCartBadge();
    }

    function openDetail(id) {
      const products = getProducts();
      const item = products.find(p => p.id === id);
      if (!item) return;

      document.getElementById('modalImg').src = item.image;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalPrice').innerText = 'Rp ' + Number(item.price).toLocaleString('id-ID');
      document.getElementById('modalDesc').innerText = item.desc || "Produk berkualitas dari toko kami.";
      
      const btn = document.getElementById('modalAddBtn');
      btn.onclick = function() {
        addToCart(item.id);
        closeModal('detailModal');
      };

      document.getElementById('detailModal').classList.add('active');
    }

    function addToCart(id) {
      const products = getProducts();
      const item = products.find(p => p.id === id);
      if (!item) return;

      cart.push(item);
      localStorage.setItem('sopy_cart', JSON.stringify(cart));
      updateCartBadge();
      alert(`"${item.title}" berhasil ditambah ke keranjang!`);
    }

    function updateCartBadge() {
      document.getElementById('cartCount').innerText = cart.length;
    }

    function openCartModal() {
      const list = document.getElementById('cartList');
      let total = 0;

      if (cart.length === 0) {
        list.innerHTML = `<div style="text-align:center; color:#888; padding:20px;">Keranjang masih kosong.</div>`;
      } else {
        let html = '';
        cart.forEach((item, idx) => {
          total += Number(item.price);
          html += `
            <div class="cart-item">
              <img src="${item.image}">
              <div class="cart-item-info">
                <div class="cart-item-title">${item.title}</div>
                <div class="cart-item-price">Rp ${Number(item.price).toLocaleString('id-ID')}</div>
              </div>
              <i class="fas fa-trash" style="color:#dc3545; cursor:pointer;" onclick="removeFromCart(${idx})"></i>
            </div>
          `;
        });
        list.innerHTML = html;
      }

      document.getElementById('cartTotal').innerText = 'Rp ' + total.toLocaleString('id-ID');
      document.getElementById('cartModal').classList.add('active');
    }

    function removeFromCart(idx) {
      cart.splice(idx, 1);
      localStorage.setItem('sopy_cart', JSON.stringify(cart));
      openCartModal();
      updateCartBadge();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Keranjang kamu kosong!");
        return;
      }
      alert("Pesanan kamu berhasil dibuat!");
      cart = [];
      localStorage.removeItem('sopy_cart');
      closeModal('cartModal');
      updateCartBadge();
    }

    renderProducts();
  </script>
</body>
</html>
