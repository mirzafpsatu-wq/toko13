<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopy Online - Admin Upload</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root { --shopee-orange: #ee4d2d; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; color: #333; }
    
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    
    .header { background: var(--shopee-orange); color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .btn-toko { background: white; color: var(--shopee-orange); padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 12px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; font-size: 13px; }
    
    .btn-submit { background: var(--shopee-orange); color: white; border: none; padding: 11px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; font-size: 12px; text-align: left; }
    .img-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; }
    .btn-del { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
  </style>

  <!-- SAMBUNGAN SERVER DATABASE GOOGLE (FIREBASE) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><i class="fas fa-cloud-upload-alt"></i> Panel Admin Upload Produk</h2>
      <a href="index.html" class="btn-toko"><i class="fas fa-store"></i> Buka Toko Customer</a>
    </div>

    <!-- FORM UPLOAD -->
    <div class="card">
      <h3 style="margin-bottom: 15px; color: var(--shopee-orange);"><i class="fas fa-plus-circle"></i> Tambah Produk Baru</h3>
      
      <form id="uploadForm" onsubmit="saveProductToCloud(event)">
        <div class="form-group">
          <label>Nama Produk*</label>
          <input type="text" id="prodTitle" placeholder="Contoh: Sepatu Sneaker Putih" required>
        </div>

        <div class="form-group">
          <label>Harga (Rp)*</label>
          <input type="number" id="prodPrice" placeholder="Contoh: 120000" required>
        </div>

        <div class="form-group">
          <label>Pilih File Foto Gambar (HP / Laptop)*</label>
          <input type="file" id="prodFile" accept="image/*" onchange="convertImageToBase64(this)" required>
        </div>

        <div id="previewBox" style="display:none; margin-bottom:12px;">
          <label style="font-size:11px; color:#666;">Preview Foto:</label><br>
          <img id="imgPreview" src="" style="max-height: 100px; border-radius: 4px; border: 1px solid #ccc; margin-top: 5px;">
        </div>

        <button type="submit" class="btn-submit" id="btnSave"><i class="fas fa-upload"></i> Upload & Tampilkan ke Toko</button>
      </form>
    </div>

    <!-- TABEL MANAJEMEN PRODUK -->
    <div class="card">
      <h3><i class="fas fa-boxes"></i> Daftar Produk Aktif di Server</h3>
      <table>
        <thead>
          <tr>
            <th>Gambar</th>
            <th>Nama Produk</th>
            <th>Harga</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr><td colspan="4" style="text-align:center;">Memuat data produk...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // URL DATABASE YANG SAMA DENGAN CUSTOMER
    const firebaseConfig = {
      databaseURL: "https://sopy-online-demo-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let compressedBase64Image = "";

    function convertImageToBase64(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxW = 350;
            const scale = maxW / img.width;
            canvas.width = maxW;
            canvas.height = img.height * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            compressedBase64Image = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('imgPreview').src = compressedBase64Image;
            document.getElementById('previewBox').style.display = 'block';
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // MENGIRIM DATA PRODUK & GAMBAR KE SERVER SAMA YANG DIBACA CUSTOMER
    function saveProductToCloud(e) {
      e.preventDefault();

      if (!compressedBase64Image) {
        alert("Pilih file foto terlebih dahulu!");
        return;
      }

      const btn = document.getElementById('btnSave');
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Mengunggah...`;
      btn.disabled = true;

      const title = document.getElementById('prodTitle').value;
      const price = Number(document.getElementById('prodPrice').value);

      db.ref('products').push({
        title: title,
        price: price,
        image: compressedBase64Image,
        createdAt: Date.now()
      }).then(() => {
        alert("Berhasil! Produk dan Foto tersimpan & tampil di toko customer!");
        
        document.getElementById('uploadForm').reset();
        document.getElementById('previewBox').style.display = 'none';
        compressedBase64Image = "";
        btn.innerHTML = `<i class="fas fa-upload"></i> Upload & Tampilkan ke Toko`;
        btn.disabled = false;
      }).catch(err => {
        alert("Gagal mengupload: " + err.message);
        btn.innerHTML = `<i class="fas fa-upload"></i> Upload & Tampilkan ke Toko`;
        btn.disabled = false;
      });
    }

    db.ref('products').on('value', (snapshot) => {
      const tbody = document.getElementById('adminTableBody');
      const data = snapshot.val();

      if (!data) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">Belum ada produk di database.</td></tr>`;
        return;
      }

      let html = '';
      Object.keys(data).reverse().forEach(key => {
        const p = data[key];
        html += `
          <tr>
            <td><img src="${p.image}" class="img-thumb"></td>
            <td><b>${p.title}</b></td>
            <td>Rp ${Number(p.price).toLocaleString('id-ID')}</td>
            <td><button class="btn-del" onclick="deleteProductFromCloud('${key}')"><i class="fas fa-trash"></i> Hapus</button></td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    });

    function deleteProductFromCloud(key) {
      if(confirm("Hapus produk ini dari toko secara permanen?")) {
        db.ref('products/' + key).remove();
      }
    }
  </script>
</body>
</html>
